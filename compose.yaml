name: shift-scheduler

services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: schedule
            POSTGRES_USER: schedule
            POSTGRES_PASSWORD: schedule
        ports:
            - '127.0.0.1:5433:5432'
        volumes:
            - schedule-postgres:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U schedule -d schedule']
            interval: 3s
            timeout: 3s
            retries: 10

volumes:
    schedule-postgres:
